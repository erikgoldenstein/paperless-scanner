<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Paperless Scanner</title>
  <desc id="desc">A page entering a four-color shredder and shredded strips leaving below.</desc>

  <!-- Plain page entering from above. -->
  <path d="M9.5 7h37.5l7.5 7.5V26h-45z" fill="#fff" stroke="#20242a" stroke-width=".75"/>

  <!-- Seven offset strips of paper leaving below, behind the shredder blocks. -->
  <path d="M9.5 35h5v16h-5zM15.5 35h6v13h-6zM22.5 35h5v17h-5zM28.5 35h6v14h-6zM35.5 35h5v16h-5zM41.5 35h6v12h-6zM48.5 35h6v15h-6z" fill="#fff" stroke="#20242a" stroke-width=".75"/>

  <!-- The four connected action-button colors sit above everything. -->
  <rect x="8" y="24" width="12" height="12" fill="#2f9e5b"/>
  <rect x="20" y="24" width="12" height="12" fill="#e88927"/>
  <rect x="32" y="24" width="12" height="12" fill="#3277d3"/>
  <rect x="44" y="24" width="12" height="12" fill="#cf3e3e"/>
</svg>
