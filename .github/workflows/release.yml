name: Release Linux packages

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  linux:
    name: Build Debian and Fedora packages
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            sane-utils libopenjp2-7-dev rpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build Debian and Fedora packages
        run: ./scripts/build-packages.sh "${GITHUB_REF_NAME#v}"

      - name: Validate package artifacts
        run: |
          shopt -s nullglob
          deb_packages=(target/release/bundle/deb/*.deb)
          rpm_packages=(target/release/bundle/rpm/*.rpm)
          test "${#deb_packages[@]}" -eq 1
          test "${#rpm_packages[@]}" -eq 1
          dpkg-deb --info "${deb_packages[0]}"
          rpm --queryformat '%{NAME} %{VERSION}-%{RELEASE} %{ARCH}\n' -qp "${rpm_packages[0]}"

      - name: Upload packages to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: paperless-scanner-linux-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          packages=(target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${packages[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${packages[@]}" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
